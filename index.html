<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>mallang charm</title>
<style>
  :root{
    --ink:#14121A;--chrome-1:#FDFDFF;--chrome-2:#C9C9D6;--chrome-4:#EDEDF4;
    --pink:#FF4E8E;--mint:#7FF0DC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#4B4B54;
    font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  #grade{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(125% 95% at 46% 40%,rgba(0,0,0,0) 40%,rgba(18,16,26,.6) 100%);}
  #grain{position:fixed;inset:-50%;pointer-events:none;z-index:3;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    animation:gs 1.1s steps(3) infinite;}
  @keyframes gs{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

  header{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 15px) 20px 0;}
  .wordmark{display:inline-block;font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1;
    background:linear-gradient(178deg,#FFFFFF 0%,#EAEAF2 26%,#9E9EB2 48%,#F7F7FC 54%,#C6C6D6 74%,#FFFFFF 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.85)) drop-shadow(0 2px 3px rgba(0,0,0,.55))
           drop-shadow(0 6px 18px rgba(0,0,0,.5));}
  .sub{display:block;margin-top:4px;font-size:9px;font-weight:700;letter-spacing:.42em;
    color:#EEEEF4;opacity:.85;text-transform:uppercase;
    text-shadow:0 1px 4px rgba(0,0,0,.75);}
  /* Background color, Reflections, and Backdrop style used to live here as
     three separate floating pill rows -- by the time a fourth preset group
     was added the corner was an unreadable stack of near-identical circles.
     All three now live in the tray's Scene tab instead, using the same
     chip/swatch styling as every other option group, with the tray's usual
     scroll and label conventions instead of unlabeled floating dots. */
  @media (max-width:520px){
    #langSwitch{top:calc(env(safe-area-inset-top) + 12px);right:12px;}
    .langBtn{padding:4px 7px;font-size:9.5px;}
    /* "ENG / 中文 / 日本語" is wider than the old "EN / 中 / 日", so at narrow
       widths give it room by shrinking the wordmark rather than letting the
       two rows collide. */
    .wordmark{font-size:22px;}
  }
  @media (max-width:340px){
    .langBtn{padding:3px 5px;font-size:8.5px;}
    .wordmark{font-size:16px;}
  }
  .hint{position:fixed;top:calc(env(safe-area-inset-top) + 76px);left:20px;z-index:5;
    font-size:11px;font-weight:600;color:#F4F4F8;opacity:.92;pointer-events:none;
    transition:opacity .6s ease;text-shadow:0 1px 3px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.6);
    line-height:1.5;}
  .hint.gone{opacity:0;}
  .hint b{font-weight:700;color:var(--mint);}
  .hint span{opacity:.62;}

  #tray{position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(to top,rgba(14,13,19,.97) 40%,rgba(14,13,19,.86) 68%,rgba(14,13,19,0));}
  #tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 9px;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;cursor:pointer;border:0;background:none;padding:5px 3px 6px;
    font:inherit;color:#C3C4D2;text-align:center;min-width:56px;}
  .tab .en{display:block;font-size:12px;font-weight:800;}
  .tab .ko{display:block;font-size:8px;font-weight:600;letter-spacing:.08em;opacity:.72;margin-top:2px;}
  .tab[aria-selected="true"]{color:#fff;}
  .tab[aria-selected="true"] .en{background:linear-gradient(180deg,#FFF 0%,#D6D6E4 52%,#FFF 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tab[aria-selected="true"]::after{content:"";display:block;height:3px;margin:5px auto 0;width:20px;
    border-radius:9px;background:var(--pink);box-shadow:0 0 9px var(--pink);}

  #row{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px;min-height:48px;}
  #row::-webkit-scrollbar{display:none;}
  /* stacked above #bgSwatches, which already occupies this top-right corner */
  #langSwitch{position:fixed;top:calc(env(safe-area-inset-top) + 15px);right:20px;z-index:6;
    display:flex;gap:4px;pointer-events:auto;}
  .langBtn{border:2px solid var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;
    font:inherit;font-size:11px;font-weight:800;color:var(--ink);
    background:linear-gradient(180deg,var(--chrome-1) 0%,var(--chrome-4) 44%,var(--chrome-2) 56%,#FFF 100%);
    box-shadow:0 2px 0 var(--ink);
    transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;}
  .langBtn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink);}
  .langBtn[aria-pressed="true"]{background:linear-gradient(180deg,#FF7FB0 0%,var(--pink) 52%,#FF9AC2 100%);color:#fff;}
  #row2:empty{display:none;}
  #row2{display:flex;align-items:center;gap:10px;padding:2px 4px 4px;}
  #row3:empty{display:none;}
  #row3{display:flex;align-items:center;gap:10px;padding:2px 4px 4px;flex-wrap:wrap;}
  .sldlab{flex:0 0 auto;font-size:11px;font-weight:800;color:#E4E4EE;letter-spacing:-.01em;}
  .sldlab .ko{font-size:8px;font-weight:600;opacity:.5;margin-left:3px;}
  .sldval{flex:0 0 auto;min-width:34px;text-align:right;font-size:11px;font-weight:700;
    color:#B9B9C8;font-variant-numeric:tabular-nums;}
  input[type=range].sld{
    -webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:90px;height:22px;
    background:transparent;cursor:pointer;}
  input[type=range].sld::-webkit-slider-runnable-track{
    height:8px;border-radius:99px;border:2px solid var(--ink);
    background:linear-gradient(180deg,#FFF 0%,#D8D8E4 52%,#FFF 100%);}
  input[type=range].sld::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-8px;
    border-radius:99px;border:2px solid var(--ink);
    background:linear-gradient(180deg,#FF8CB8 0%,var(--pink) 55%,#FFA6C8 100%);
    box-shadow:0 2px 0 var(--ink);}
  input[type=range].sld::-moz-range-track{
    height:8px;border-radius:99px;border:2px solid var(--ink);
    background:linear-gradient(180deg,#FFF 0%,#D8D8E4 52%,#FFF 100%);}
  input[type=range].sld::-moz-range-thumb{
    width:18px;height:18px;border-radius:99px;border:2px solid var(--ink);
    background:linear-gradient(180deg,#FF8CB8 0%,var(--pink) 55%,#FFA6C8 100%);}

  .chip{flex:0 0 auto;cursor:pointer;border:2px solid var(--ink);border-radius:999px;
    background:linear-gradient(180deg,var(--chrome-1) 0%,var(--chrome-4) 44%,var(--chrome-2) 56%,#FFF 100%);
    color:var(--ink);font:inherit;font-size:12px;font-weight:800;padding:9px 14px;line-height:1;
    box-shadow:0 2px 0 var(--ink);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;}
  .chip .ko{font-size:9px;font-weight:600;opacity:.5;margin-left:5px;}
  .chip:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink);}
  .chip[aria-pressed="true"]{background:linear-gradient(180deg,#FF7FB0 0%,var(--pink) 52%,#FF9AC2 100%);color:#fff;}
  .chip[aria-pressed="true"] .ko{opacity:.75;}

  .sw{flex:0 0 auto;width:34px;height:34px;border-radius:999px;border:2px solid var(--ink);
    box-shadow:0 2px 0 var(--ink);cursor:pointer;padding:0;
    transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;}
  .sw:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink);}
  .sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px;}
  .art{flex:0 0 auto;width:42px;height:42px;border-radius:13px;border:2px solid var(--ink);
    background:linear-gradient(180deg,#FFF,#DCDCE8);box-shadow:0 2px 0 var(--ink);
    cursor:pointer;padding:0;overflow:hidden;
    transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;}
  .art img{width:100%;height:100%;display:block;}
  .art:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink);}
  .art[aria-pressed="true"]{background:linear-gradient(180deg,#FFB4D2,#FF4E8E);}

  .fab{position:fixed;right:15px;z-index:6;cursor:pointer;border:2px solid var(--ink);
    border-radius:999px;font:inherit;font-weight:800;box-shadow:0 3px 0 var(--ink);
    transition:transform .1s cubic-bezier(.3,1.6,.5,1),box-shadow .1s;}
  .fab:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
  #shutter{bottom:calc(env(safe-area-inset-bottom) + 128px);width:62px;height:62px;border-width:3px;
    background:linear-gradient(165deg,#FFF 0%,#E2E2EE 40%,#9E9EB4 52%,#FFF 100%);
    box-shadow:0 4px 0 var(--ink),0 0 22px rgba(255,255,255,.22);
    display:grid;place-items:center;line-height:1.15;font-size:11px;color:var(--ink);}
  #shutter i{font-style:normal;font-size:8px;font-weight:600;opacity:.5;display:block;}
  #reset{bottom:calc(env(safe-area-inset-bottom) + 200px);padding:9px 13px;font-size:11px;
    background:linear-gradient(180deg,#FFF,#D8D8E6);color:var(--ink);}
  #tilt{bottom:calc(env(safe-area-inset-bottom) + 246px);padding:9px 13px;font-size:11px;
    display:none;background:linear-gradient(180deg,#B9FFF0,var(--mint));color:var(--ink);}
  #flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none;}
  #flash.pop{animation:pop .45s ease-out;}
  @keyframes pop{0%{opacity:.9}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#grain{animation:none}.chip,.sw,.art,.fab{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grade"></div><div id="grain"></div>

<header>
  <span class="wordmark">mallang charm</span>
  <span class="sub">말랑참 · <span id="subTag">design &amp; swing</span></span>
</header>
<div id="langSwitch" role="group" aria-label="Language"></div>
<div class="hint" id="hint">
  <span id="hint1">Drag to spin the phone</span> <b>·</b> <span id="hint1b">flick it and let go</span><br>
  <span id="hint2">Two fingers, or shift-drag, to move it</span>
</div>

<button class="fab" id="tilt" aria-pressed="false">Tilt off</button>
<button class="fab" id="reset">Reset</button>
<button class="fab" id="shutter" aria-label="Take a photo"><span id="snapLabel">SNAP</span><i>찰칵</i></button>

<div id="tray"><div id="tabs" role="tablist"></div><div id="row"></div><div id="row2"></div><div id="row3"></div></div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function(){
"use strict";
const V3=THREE.Vector3, Q=THREE.Quaternion, MU=THREE.MathUtils;

/* ===================================================================
   UNITS
   1 world unit = 0.10 m.  Phone is 1.56 u = 15.6 cm.  Mass in kg.
   Everything below is derived from that, which is why it has weight.
   =================================================================== */
const U_PER_M = 10;
const GRAVITY = 9.81 * U_PER_M * .65;
const CHARM_MASS_SCALE = .1;

/* ===================================================================
   CONTENT
   =================================================================== */
// trans: real transmission amount (0 = fully opaque, replaces the old
// alpha-based opacity for how see-through each swatch reads). Chrome stays
// at 0 since it's metal, not glass -- transmission has no meaning there.
const CASES=[
  {n:"Clear",  zh:"透明",   ja:"クリア",     hex:0xF8FAFF, trans:0.92, metal:0.0, rough:0.026, env:2.4},
  {n:"Milk",   zh:"牛奶白", ja:"ミルク",     hex:0xFBF3EA, trans:0.16, metal:0.0, rough:0.16,  env:1.3},
  {n:"Bubble", zh:"泡泡糖", ja:"バブルガム", hex:0xFF9CC0, trans:0.55, metal:0.0, rough:0.05,  env:1.9},
  {n:"Mint",   zh:"薄荷",   ja:"ミント",     hex:0x8FEFDD, trans:0.55, metal:0.0, rough:0.05,  env:1.9},
  {n:"Lilac",  zh:"淡紫",   ja:"ライラック", hex:0xBFA9FF, trans:0.55, metal:0.0, rough:0.05,  env:1.9},
  {n:"Chrome", zh:"镀铬",   ja:"クローム",   hex:0xEFEFF6, trans:0.0,  metal:1.0, rough:0.05,  env:2.6},
];
// volFactor: fraction of the bounding box the shape actually fills.
// densityMul: metal frame is a zinc-alloy shell, far denser than acrylic.
const SHAPES=[
  {k:"frame",  n:"Frame",  ko:"액자", zh:"相框",   ja:"フレーム",   volFactor:.62, densityMul:1.0},
  {k:"sakura", n:"Sakura", ko:"벚꽃", zh:"樱花",   ja:"桜",         volFactor:.42, densityMul:1.0},
  {k:"heart",  n:"Heart",  ko:"하트", zh:"爱心",   ja:"ハート",     volFactor:.58, densityMul:1.0},
  {k:"tag",    n:"Tag",    ko:"태그", zh:"吊牌",   ja:"タグ",       volFactor:.80, densityMul:1.0},
  {k:"keyboard",n:"Keyboard",ko:"키보드",zh:"键帽", ja:"キーキャップ",volFactor:.64,densityMul:1.0},
  {k:"bunny",   n:"Bunny",   ko:"토끼",  zh:"兔子", ja:"うさぎ",     volFactor:.55,densityMul:1.0},
  {k:"ribbon",  n:"Ribbon",  ko:"리본",  zh:"蝴蝶结",ja:"リボン",    volFactor:.48,densityMul:1.0},
  {k:"pudding", n:"Pudding", ko:"푸딩",  zh:"布丁", ja:"プリン",     volFactor:.68,densityMul:1.0},
];
// density in g/cm^3 (real values). restitution/friction are contact properties.
const MATERIALS=[
  // transmission/attenuation replace the old opacity-based fake transparency.
  // acrylic: clearest, sharpest. jelly: softer/frostier, more saturated color
  // for the same thickness (shorter attenuationDistance). glitter: the
  // flakes scatter light, so it's the least see-through of the three.
  {k:"acrylic",n:"Acrylic",ko:"아크릴", zh:"亚克力",ja:"アクリル", density:1.19, restitution:.06, friction:.45,
   angDamp:.85, linDamp:.18, jointFric:.10, squash:0,
   transmission:1.0,attnDist:.20,rough:.028,cc:1,ccr:.024,env:2.4,sparkle:0,metalTone:0xE6E6EE},
  {k:"jelly",  n:"Jelly",  ko:"젤리",   zh:"果冻",  ja:"ゼリー",   density:1.15, restitution:.10, friction:.95,
   angDamp:1.5, linDamp:.32, jointFric:.16, squash:1,
   transmission:.88,attnDist:.09,rough:.13,cc:1,ccr:.09,env:1.8,sparkle:0,metalTone:0xE8B9A6},
  {k:"glitter",n:"Glitter",ko:"글리터", zh:"闪粉",  ja:"グリッター",density:1.62, restitution:.05, friction:.42,
   angDamp:.70, linDamp:.14, jointFric:.08, squash:0,
   transmission:.45,attnDist:.10,rough:.22,cc:1,ccr:.12,env:2.2,sparkle:1,metalTone:0xE3C079},
];
const COLORS=[
  {n:"Peach",zh:"蜜桃",ja:"ピーチ",hex:0xFFB7AB},{n:"Pink",zh:"粉色",ja:"ピンク",hex:0xFF5D93},
  {n:"Mint",zh:"薄荷",ja:"ミント",hex:0x8FEFDD},{n:"Butter",zh:"奶油黄",ja:"バター",hex:0xFFDD86},
  {n:"Lilac",zh:"淡紫",ja:"ライラック",hex:0xC4B2FF},{n:"Milk",zh:"牛奶白",ja:"ミルク",hex:0xF6EBDD},
];
const BG_COLORS=[
  {n:"Mist",zh:"雾灰",ja:"ミスト",hex:0x8E8F99},{n:"Slate",zh:"石板",ja:"スレート",hex:0x63656F},
  {n:"Dusk",zh:"暮色",ja:"ダスク",hex:0x45464F},{n:"Ink",zh:"墨色",ja:"インク",hex:0x2C2D35},
  {n:"Noir",zh:"黑色",ja:"ノワール",hex:0x15161B},
];
const HOOKS=[
  {n:"Ring",ko:"링",zh:"圆环",ja:"リング",k:"ring"},
  {n:"Heart",ko:"하트",zh:"爱心",ja:"ハート",k:"heart"},
  {n:"Sakura",ko:"벚꽃",zh:"樱花",ja:"桜",k:"sakura"},
];
// beadMass in kg, per bead. A 6 mm glass pearl is 0.28 g.
const STRANDS=[
  {k:"flower",n:"Blossom",ko:"플라워",zh:"花朵",ja:"フラワー",cord:true, beadMass:.00042,bend:.00040,
   seq:["pearl","flower","pearl","crimp"]},
  {k:"pearl", n:"Pearl",  ko:"진주",  zh:"珍珠",ja:"パール",  cord:true, beadMass:.00030,bend:.00055,
   seq:["pearl","spacer"]},
  {k:"jelly", n:"Jelly",  ko:"젤리",  zh:"果冻",ja:"ゼリー",  cord:true, beadMass:.00055,bend:.00090,
   seq:["bead","crimp","bead","pearl"]},
  {k:"chain", n:"Chain",  ko:"체인",  zh:"链条",ja:"チェーン",cord:false,beadMass:.00075,bend:0,
   seq:["link"]},
];
/* Footprint each element occupies ALONG the strand. Beads are laid end to end so
   they touch; a link's footprint is deliberately half its geometry so successive
   links overlap and interlock instead of floating apart. */
/* Interface language. Korean labels (the `ko` fields above) are a fixed
   cosmetic layer and are NOT switched by this -- they render in every mode.
   `nameOf` picks the main label: current language if the table has it,
   else falls back to the English field (tables use either `n` or `en`). */
function nameOf(o){
  const v=o[S.lang];
  if(v!==undefined) return v;
  return o.n!==undefined?o.n:o.en;
}
const I18N={
  en:{tagline:"design & swing",
      hint1:"Drag to spin the phone",hint1b:"flick it and let go",
      hint2:"Two fingers, or shift-drag, to move it",
      tiltOn:"Tilt on",tiltOff:"Tilt off",reset:"Reset",snap:"SNAP",length:"Length",
      takePhoto:"Take a photo",chainLength:"Chain length",
      bgColor:"Background color",bgSuffix:" background",reflectionSuffix:" reflections",backdropSuffix:" backdrop",
      reflectionsLabel:"Reflections",backdropLabel:"Backdrop"},
  zh:{tagline:"设计与摇摆",
      hint1:"拖动手机旋转",hint1b:"轻甩后松开",
      hint2:"双指或按住 Shift 拖动可移动位置",
      tiltOn:"倾斜开启",tiltOff:"倾斜关闭",reset:"重置",snap:"拍照",length:"长度",
      takePhoto:"拍照",chainLength:"链长",
      bgColor:"背景颜色",bgSuffix:" 背景",reflectionSuffix:" 反射",backdropSuffix:" 背景样式",
      reflectionsLabel:"反射",backdropLabel:"背景样式"},
  ja:{tagline:"デザイン＆スイング",
      hint1:"ドラッグしてスマホを回す",hint1b:"はじいて手を離す",
      hint2:"二本指、またはShift+ドラッグで移動",
      tiltOn:"傾き ON",tiltOff:"傾き OFF",reset:"リセット",snap:"撮影",length:"長さ",
      takePhoto:"写真を撮る",chainLength:"チェーンの長さ",
      bgColor:"背景色",bgSuffix:" 背景",reflectionSuffix:" 反射",backdropSuffix:" 背景スタイル",
      reflectionsLabel:"反射",backdropLabel:"背景スタイル"},
};
function T(k){return I18N[S.lang][k];}
const ELEM={
  link:  {len:.0145},
  pearl: {len:.0285},
  spacer:{len:.0085},
  flower:{len:.0270},
  bead:  {len:.0345},
  crimp: {len:.0120},
};

/* ---- procedural art ---- */
const INK="#241E28";
function stroke(g,w){g.strokeStyle=INK;g.lineWidth=w;g.stroke();}
function eyes(g,cx,cy,sp,r){g.fillStyle=INK;
  g.beginPath();g.ellipse(cx-sp,cy,r,r*1.12,0,0,7);g.fill();
  g.beginPath();g.ellipse(cx+sp,cy,r,r*1.12,0,0,7);g.fill();}
function blush(g,x,y,r,c){g.fillStyle=c;g.globalAlpha=.72;
  g.beginPath();g.ellipse(x,y,r,r*.7,0,0,7);g.fill();g.globalAlpha=1;}
const ART={
  bear:function(g,S,c){const cx=S/2,cy=S/2+12;g.fillStyle=c;
    [[-116,-94],[116,-94]].forEach(function(p){g.beginPath();g.arc(cx+p[0],cy+p[1],56,0,7);g.fill();stroke(g,14);});
    g.fillStyle=c;g.beginPath();g.ellipse(cx,cy,148,130,0,0,7);g.fill();stroke(g,15);
    eyes(g,cx,cy-14,57,15);blush(g,cx-90,cy+34,29,"#FF7EA3");blush(g,cx+90,cy+34,29,"#FF7EA3");
    g.beginPath();g.moveTo(cx-26,cy+44);g.quadraticCurveTo(cx-13,cy+68,cx,cy+47);
    g.quadraticCurveTo(cx+13,cy+68,cx+26,cy+44);stroke(g,11);},

function keycapGeometry(bw,bh,tw,th,d,rB,rT,dish){

    // the outline closes on itself; drop the repeated last point so the seam
    // corner shares one vertex and shades smoothly like the other three
    if(p.length>1&&p[0].distanceTo(p[p.length-1])<1e-6) p.pop();
    return p;
  }
  const b=ring(bw,bh,rB), t=ring(tw,th,rT);
  const n=Math.min(b.length,t.length);
  const z0=-d/2, z1=d/2;
  const pos=[], idx=[];
  for(let i=0;i<n;i++) pos.push(b[i].x,b[i].y,z0);              // 0 .. n-1
  for(let i=0;i<n;i++) pos.push(t[i].x,t[i].y,z1);              // n .. 2n-1
  for(let i=0;i<n;i++){const j=(i+1)%n;
    idx.push(i,j,n+j, i,n+j,n+i);}                              // skirt
  const cT=n*2;
  for(let i=0;i<n;i++) pos.push(t[i].x,t[i].y,z1);              // 2n .. 3n-1
  pos.push(0,0,z1-dish);                                        // 3n  top centre
  for(let i=0;i<n;i++){const j=(i+1)%n;idx.push(3*n,cT+i,cT+j);}
  const cB=3*n+1;
  for(let i=0;i<n;i++) pos.push(b[i].x,b[i].y,z0);              // 3n+1 .. 4n
  pos.push(0,0,z0);                                             // 4n+1 bottom centre

    const topping=addPart(new THREE.Mesh(new THREE.SphereGeometry(.055,14,10),matBead));

    cherry.position.set(.035,.205,.075);

    addPart(new THREE.Mesh(extrude(heartShape(CH.h*1.05),CH.d,.016,28),matAcrylic),true).renderOrder=2;
    const a=addPart(new THREE.Mesh(new THREE.PlaneGeometry(CH.w*.60,CH.w*.60),matArt),true);
    a.position.set(0,-.015,.006);a.renderOrder=1;
  } else {
    addPart(new THREE.Mesh(extrude(roundRectShape(CH.w,CH.h,.11),CH.d,.016,26),matAcrylic),true).renderOrder=2;
    const a=addPart(new THREE.Mesh(new THREE.PlaneGeometry(CH.w*.84,CH.w*.84),matArt),true);

function redrawArt(){
  artG.clearRect(0,0,512,512);artG.lineJoin="round";artG.lineCap="round";
  ART[ART_KEYS[S.art]](artG,512,"#FFFFFF");artTex.needsUpdate=true;

/* ===================================================================
   XPBD SOLVER
   Particles for the strand, one real rigid body for the pendant.
   =================================================================== */
// 6 x .030 gave a 0.15 strand against a 0.54 pendant: once the clasp and the
// end margins were subtracted there was almost no room left for beads, so the
// strand rendered as a stub. 8 x .040 gives ~0.32, close to the strand:charm
// ratio in real phone charms.
const NLINK=8;
// Segment rest length is live: the slider retunes the existing constraints rather
// than rebuilding the rig, so particle count and topology never change.
const LINK_MIN=.020, LINK_MAX=.078, LINK_DEF=.040;
let LINKLEN=LINK_DEF;
const SUB=14;                              // XPBD converges with substeps, not iterations

/* --- particles --- */
function Particle(x,y,z,invMass,r){
  return {p:new V3(x,y,z),pr:new V3(x,y,z),v:new V3(),w:invMass,r:r||.018};
}
const P=[];
for(let i=0;i<NLINK;i++) P.push(Particle(0,.8-i*LINKLEN,0,i===0?0:1/.0004,.016));

/* --- rigid body --- */
function Body(){
  return {x:new V3(),q:new Q(),xp:new V3(),qp:new Q(),
          v:new V3(),w:new V3(),invMass:0,invI:new V3(),
          restitution:.1,friction:.5};
}
const pend=Body();
const ANCH_L=new V3(0,CH.h/2+CH.ringGap,0);   // where the chain meets the pendant, body-local

/* mass and inertia from real dimensions and density */
function rebuildInertia(){
  const sh=SH(), M=MT();
  // bounding box in cm, times fill factor, times density -> grams -> kg
  // units -> cm. One unit is 1/U_PER_M metres, so cm = units * 100 / U_PER_M.
  // This was units * U_PER_M * 10, i.e. 10x too big on every axis and therefore
  // 1000x too heavy: a 9.3 g charm came out as 9.3 kg, which against 0.42 g beads
  // is a ~2000:1 mass ratio the solver cannot hold. The strand stretched to
  // absurd lengths, which is why the beads no longer reached the pendant.
  const CM=100/U_PER_M;
  const wcm=CH.w*CM, hcm=CH.h*CM, dcm=CH.d*CM;
  const grams=wcm*hcm*dcm*sh.volFactor*M.density*sh.densityMul;
  const m=grams/1000*CHARM_MASS_SCALE;
  const w=CH.w*Math.sqrt(sh.volFactor), h=CH.h*Math.sqrt(sh.volFactor), d=CH.d;
  const Ix=m*(h*h+d*d)/12, Iy=m*(w*w+d*d)/12, Iz=m*(w*w+h*h)/12;
  pend.invMass=1/m;
  pend.invI.set(1/Ix,1/Iy,1/Iz);
  pend.restitution=M.restitution;
  pend.friction=M.friction;
  pend.grams=grams;
}

/* contact sample points on the pendant, body-local */
let SAMPLES=[];
function rebuildSamples(){
  const w=CH.w*.49,h=CH.h*.49,d=CH.d*.5;
  SAMPLES=[];
  const levels=[-1,0,1];
  [ -1,1 ].forEach(function(side){
    levels.forEach(function(y){levels.forEach(function(z){SAMPLES.push(new V3(side*w,y*h,z*d));});});
    levels.forEach(function(x){levels.forEach(function(z){SAMPLES.push(new V3(x*w,side*h,z*d));});});
    levels.forEach(function(x){levels.forEach(function(y){SAMPLES.push(new V3(x*w,y*h,side*d));});});
  });
}
rebuildSamples();

/* --- constraints --- */
const dist=[];      // strand segment lengths
const bend=[];      // i -> i+2, keeps the cord from folding like paper
for(let i=0;i<NLINK-1;i++) dist.push({a:i,b:i+1,rest:LINKLEN,compliance:0,lambda:0});
for(let i=0;i<NLINK-2;i++) bend.push({a:i,b:i+2,rest:LINKLEN*1.94,compliance:4e-4,lambda:0});

/* ---- rigid-body maths ---- */
const _qc=new Q(),_t=new V3(),_rn=new V3(),_rp=new V3(),_dw=new V3(),_n=new V3();
function invIWorld(b,vec,out){
  _qc.copy(b.q).conjugate();
  out.copy(vec).applyQuaternion(_qc);
  out.set(out.x*b.invI.x,out.y*b.invI.y,out.z*b.invI.z);
  out.applyQuaternion(b.q);
}
function genInvMass(b,r,n){
  _rn.crossVectors(r,n);invIWorld(b,_rn,_t);
  return b.invMass+_rn.dot(_t);
}
function applyPosImpulse(b,p,r,sign){
  b.x.addScaledVector(p,sign*b.invMass);
  _rp.crossVectors(r,p).multiplyScalar(sign);
  invIWorld(b,_rp,_dw);
  const dq=new Q(_dw.x,_dw.y,_dw.z,0).multiply(b.q);
  b.q.set(b.q.x+.5*dq.x,b.q.y+.5*dq.y,b.q.z+.5*dq.z,b.q.w+.5*dq.w).normalize();
}
function applyVelImpulse(b,dv,r){
  const L=dv.length();if(L<1e-9)return;
  _n.copy(dv).multiplyScalar(1/L);
  const w=genInvMass(b,r,_n);if(w<=0)return;
  const J=_n.clone().multiplyScalar(L/w);
  b.v.addScaledVector(J,b.invMass);
  _rp.crossVectors(r,J);invIWorld(b,_rp,_dw);b.w.add(_dw);
}
function pointVel(b,r,out){out.crossVectors(b.w,r).add(b.v);}

/* ---- phone kinematics, sampled per substep ---- */
const phPos=new V3(),phQuat=new Q(),phInv=new Q();
const phVel=new V3(),phOmega=new V3();
const phPosA=new V3(),phPosB=new V3(),phQuatA=new Q(),phQuatB=new Q();

/* ---- contact record ---- */
let contacts=[];
function pushContact(kind,idx,r,n,vnPre){
  contacts.push({kind:kind,idx:idx,r:r.clone(),n:n.clone(),vnPre:vnPre});
}
const _lp=new V3(),_wp=new V3(),_pv=new V3(),_rel=new V3(),_vt=new V3(),_dv=new V3();

function phonePointVel(worldPos,out){
  _t.subVectors(worldPos,phPos);
  out.crossVectors(phOmega,_t).add(phVel);
}

/* box test in phone-local space; returns penetration depth and world normal */
function boxResolve(worldPos,radius,outN){
  _lp.copy(worldPos).sub(phPos).applyQuaternion(phInv);
  const ex=PH.cw/2+radius, ey=PH.ch/2+radius, ez=PH.cd/2+radius;
  if(Math.abs(_lp.x)>=ex||Math.abs(_lp.y)>=ey||Math.abs(_lp.z)>=ez) return 0;
  const px=ex-Math.abs(_lp.x),py=ey-Math.abs(_lp.y),pz=ez-Math.abs(_lp.z);
  let depth;
  if(pz<=px&&pz<=py){depth=pz;outN.set(0,0,_lp.z>=0?1:-1);}
  else if(px<=py)   {depth=px;outN.set(_lp.x>=0?1:-1,0,0);}
  else              {depth=py;outN.set(0,_lp.y>=0?1:-1,0);}
  outN.applyQuaternion(phQuat);
  return depth;
}

/* ===================================================================
   UNSTICK -- the per-substep contact solver only ever pushes out along the
   axis of LEAST penetration for each point independently. When the pendant
   gets wedged into a corner of the case, two sample points can end up
   fighting over different axes and the correction cancels out frame after
   frame, which is what "stuck" actually is. Rather than trying to make the
   continuous solver corner-proof, this does one direct positional fix: for
   every strand particle and pendant sample currently inside the case, push
   it out along its own contact normal by more than the penetration depth,
   and hand it an outward velocity (plus a little randomness, so a body
   wedged symmetrically doesn't just settle straight back into the same
   corner). It is only invoked on an explicit shake gesture, never silently
   every frame, so it can't fight the normal solver during ordinary play.
   ------------------------------------------------------------------- */
const UNSTICK_CLEAR=.016, UNSTICK_KICK=1.35, UNSTICK_JITTER=.55, UNSTICK_SPIN=5.5;
const _accN=new V3(),_jit=new V3();
function jitter3(v){v.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);
  if(v.lengthSq()<1e-6) v.set(1,0,0); return v.normalize();}
function tryUnstick(){
  let hit=false;
  for(let i=1;i<P.length;i++){
    const q=P[i];
    const depth=boxResolve(q.p,q.r,_n);
    if(depth<=0) continue;
    q.p.addScaledVector(_n,depth+UNSTICK_CLEAR);
    q.v.copy(_n).multiplyScalar(UNSTICK_KICK).addScaledVector(jitter3(_jit),UNSTICK_JITTER);
    hit=true;
  }
  _accN.set(0,0,0);let maxDepth=0,count=0;
  for(let s=0;s<SAMPLES.length;s++){
    _rA.copy(SAMPLES[s]).applyQuaternion(pend.q);
    _wp.copy(pend.x).add(_rA);
    const depth=boxResolve(_wp,.010,_n);
    if(depth<=0) continue;
    _accN.addScaledVector(_n,depth);maxDepth=Math.max(maxDepth,depth);count++;
  }
  {const depth=boxResolve(pend.x,.020,_n);
   if(depth>0){_accN.addScaledVector(_n,depth);maxDepth=Math.max(maxDepth,depth);count++;}}
  if(count>0){
    _accN.normalize();
    pend.x.addScaledVector(_accN,maxDepth+UNSTICK_CLEAR);
    pend.v.copy(_accN).multiplyScalar(UNSTICK_KICK).addScaledVector(jitter3(_jit),UNSTICK_JITTER);
    pend.w.set((Math.random()-.5)*UNSTICK_SPIN,(Math.random()-.5)*UNSTICK_SPIN,(Math.random()-.5)*UNSTICK_SPIN);
    hit=true;
  }
  return hit;
}

/* ---- shake gesture detection: cursor-shake while spinning the phone, or a
   real device shake via accelerometer. Both call the same debounced trigger. ---- */
let unstickRequested=false;
const SHAKE_WINDOW=550, SHAKE_REVERSALS=4, SHAKE_MIN_DX=6;
let dragShakeHist=[];
function feedDragShake(dx,t){
  if(Math.abs(dx)>=SHAKE_MIN_DX) dragShakeHist.push({t:t,s:dx>0?1:-1});
  while(dragShakeHist.length&&t-dragShakeHist[0].t>SHAKE_WINDOW) dragShakeHist.shift();
  let reversals=0;
  for(let i=1;i<dragShakeHist.length;i++) if(dragShakeHist[i].s!==dragShakeHist[i-1].s) reversals++;
  if(reversals>=SHAKE_REVERSALS){unstickRequested=true;dragShakeHist.length=0;}
}
const SHAKE_ACCEL_DELTA=13, SHAKE_DEBOUNCE=700;
let lastAccelMag=null,lastShakeAt=0;
function onDeviceMotion(ev){
  const a=ev.accelerationIncludingGravity||ev.acceleration;
  if(!a||a.x===null) return;
  const mag=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
  if(lastAccelMag!==null){
    const now=performance.now();
    if(Math.abs(mag-lastAccelMag)>SHAKE_ACCEL_DELTA&&now-lastShakeAt>SHAKE_DEBOUNCE){
      lastShakeAt=now;unstickRequested=true;
    }
  }
  lastAccelMag=mag;
}
const needsMotionPerm=typeof DeviceMotionEvent!=="undefined"&&
  typeof DeviceMotionEvent.requestPermission==="function";
if(!needsMotionPerm&&typeof window.DeviceMotionEvent!=="undefined")
  window.addEventListener("devicemotion",onDeviceMotion,true);

/* ---- one substep ---- */
const _g=new V3(0,-GRAVITY,0);
const _anchorW=new V3(),_bodyAnchorW=new V3(),_delta=new V3(),_rA=new V3();
let airDrag=.18;

function substep(h,alpha){
  // phone pose for this substep
  phPos.lerpVectors(phPosA,phPosB,alpha);
  phQuat.copy(phQuatA).slerp(phQuatB,alpha);
  phInv.copy(phQuat).invert();
  contacts.length=0;

  // ---- predict ----
  for(let i=1;i<P.length;i++){
    const q=P[i];
    q.v.addScaledVector(_g,h);
    q.v.multiplyScalar(Math.max(0,1-airDrag*h));
    q.pr.copy(q.p);q.p.addScaledVector(q.v,h);
  }
  pend.v.addScaledVector(_g,h);
  pend.v.multiplyScalar(Math.max(0,1-MT().linDamp*h));
  pend.w.multiplyScalar(Math.max(0,1-MT().angDamp*h));
  pend.xp.copy(pend.x);pend.qp.copy(pend.q);
  pend.x.addScaledVector(pend.v,h);
  const dq=new Q(pend.w.x,pend.w.y,pend.w.z,0).multiply(pend.q);
  pend.q.set(pend.q.x+.5*h*dq.x,pend.q.y+.5*h*dq.y,
             pend.q.z+.5*h*dq.z,pend.q.w+.5*h*dq.w).normalize();

  // ---- anchor on the phone (kinematic) ----
  _anchorW.copy(ANCHOR_LOCAL).applyQuaternion(phQuat).add(phPos);
  P[0].p.copy(_anchorW);P[0].pr.copy(_anchorW);

  // ---- strand constraints ----
  for(let k=0;k<dist.length;k++) dist[k].lambda=0;
  for(let k=0;k<bend.length;k++) bend[k].lambda=0;
  solveDist(dist,h);
  solveDist(bend,h);

  // ---- pendant attachment: chain tip <-> body-local ring point ----
  {
    const tip=P[NLINK-1];
    _rA.copy(ANCH_L).applyQuaternion(pend.q);
    _bodyAnchorW.copy(pend.x).add(_rA);
    _delta.subVectors(_bodyAnchorW,tip.p);
    const C=_delta.length();
    if(C>1e-9){
      _n.copy(_delta).multiplyScalar(1/C);
      const wB=genInvMass(pend,_rA,_n), wP=tip.w;
      const sum=wB+wP;
      if(sum>0){
        const dl=-C/sum;
        const p=_n.clone().multiplyScalar(dl);
        applyPosImpulse(pend,p,_rA,1);
        tip.p.addScaledVector(p,-wP);
      }
    }
  }

  // ---- contacts: project repeatedly, preserving the correction in the
  // previous state so it cannot become artificial velocity next substep.
  for(let pass=0;pass<3;pass++){
    for(let i=1;i<P.length;i++){
      const q=P[i];
      const depth=boxResolve(q.p,q.r,_n);
      if(depth>0){
        phonePointVel(q.p,_pv);
        _rel.subVectors(q.v,_pv);
        if(pass===0)pushContact("p",i,q.p,_n,_rel.dot(_n));
        _t.copy(_n).multiplyScalar(depth);
        q.p.add(_t);q.pr.add(_t);
      }
    }
    for(let s=0;s<SAMPLES.length;s++){
      _rA.copy(SAMPLES[s]).applyQuaternion(pend.q);
      _wp.copy(pend.x).add(_rA);
      const depth=boxResolve(_wp,.009,_n);
      if(depth>0){
        pointVel(pend,_rA,_pv);
        phonePointVel(_wp,_t);_rel.subVectors(_pv,_t);
        if(pass===0)pushContact("b",s,_rA,_n,_rel.dot(_n));
        const w=genInvMass(pend,_rA,_n);
        if(w>0){
          _t.copy(_n).multiplyScalar(depth/w);
          applyPosImpulse(pend,_t,_rA,1);
          pend.xp.addScaledVector(_t,pend.invMass);
        }
      }
    }
  }

  // ---- velocities from positions ----
  for(let i=1;i<P.length;i++){
    const q=P[i];q.v.subVectors(q.p,q.pr).multiplyScalar(1/h);
  }
  pend.v.subVectors(pend.x,pend.xp).multiplyScalar(1/h);
  const dqv=pend.q.clone().multiply(pend.qp.clone().invert());
  pend.w.set(dqv.x,dqv.y,dqv.z).multiplyScalar(2/h);
  if(dqv.w<0) pend.w.negate();

  // ---- joint friction: damp RELATIVE velocity only ----
  // This is where the energy goes in a real strand. Damping absolute
  // velocity instead is what made the old build feel like honey.
  const kd=MT().jointFric;
  for(let k=0;k<dist.length;k++){
    const A=P[dist[k].a],B=P[dist[k].b];
    const wsum=A.w+B.w;if(wsum<=0)continue;
    _rel.subVectors(A.v,B.v).multiplyScalar(-kd/wsum);
    A.v.addScaledVector(_rel,A.w);
    B.v.addScaledVector(_rel,-B.w);
  }
  // ring friction between the strand tip and the pendant
  {
    const tip=P[NLINK-1];
    _rA.copy(ANCH_L).applyQuaternion(pend.q);
    pointVel(pend,_rA,_pv);
    _rel.subVectors(tip.v,_pv);
    const wB=genInvMass(pend,_rA,_rel.clone().normalize()||new V3(0,1,0));
    const wsum=tip.w+wB;
    if(wsum>0&&_rel.lengthSq()>1e-12){
      _dv.copy(_rel).multiplyScalar(-kd*1.4);
      tip.v.addScaledVector(_dv,tip.w/wsum);
      applyVelImpulse(pend,_dv.clone().multiplyScalar(-(wB/wsum)),_rA);
    }
  }

  // ---- contact velocity solve: restitution + friction ----
  // Without this, position projection returns all the energy as bounce.
  const e=MT().restitution, mu=MT().friction;
  for(let c=0;c<contacts.length;c++){
    const ct=contacts[c];
    if(ct.kind==="p"){
      const q=P[ct.idx];
      phonePointVel(q.p,_pv);
      _rel.subVectors(q.v,_pv);
      const vn=_rel.dot(ct.n);
      _vt.copy(_rel).addScaledVector(ct.n,-vn);
      _dv.set(0,0,0);
      _dv.addScaledVector(ct.n,-vn-e*Math.min(ct.vnPre,0));
      _dv.addScaledVector(_vt,-Math.min(1,mu*1.6));
      q.v.add(_dv);
    } else {
      _rA.copy(ct.r);
      _wp.copy(pend.x).add(_rA);
      pointVel(pend,_rA,_pv);
      phonePointVel(_wp,_t);
      _rel.subVectors(_pv,_t);
      const vn=_rel.dot(ct.n);
      _vt.copy(_rel).addScaledVector(ct.n,-vn);
      _dv.set(0,0,0);
      _dv.addScaledVector(ct.n,-vn-e*Math.min(ct.vnPre,0));
      _dv.addScaledVector(_vt,-Math.min(1,mu*1.2));
      applyVelImpulse(pend,_dv,_rA);
    }
  }
}
function solveDist(list,h){
  for(let k=0;k<list.length;k++){
    const c=list[k],A=P[c.a],B=P[c.b],wsum=A.w+B.w;
    if(wsum<=0)continue;
    _t.subVectors(A.p,B.p);
    const L=_t.length();if(L<1e-9)continue;
    _t.multiplyScalar(1/L);
    const alpha=c.compliance/(h*h);
    const dl=(-(L-c.rest)-alpha*c.lambda)/(wsum+alpha);
    c.lambda+=dl;
    A.p.addScaledVector(_t,dl*A.w);
    B.p.addScaledVector(_t,-dl*B.w);
  }
}
function stepPhysics(dt){
  const h=dt/SUB;
  for(let s=0;s<SUB;s++) substep(h,(s+1)/SUB);
}

/* Retune the strand in place. dist keeps segments at LINKLEN; bend spans two
   segments so its rest scales with it. Meshes are rebuilt because the number of
   beads that fit changes with length. */
function setStrandLength(v){
  LINKLEN=MU.clamp(v,LINK_MIN,LINK_MAX);
  for(let i=0;i<dist.length;i++) dist[i].rest=LINKLEN;
  for(let i=0;i<bend.length;i++) bend[i].rest=LINKLEN*1.94;
  buildStrand();
}

/* ---- strand meshes -------------------------------------------------
   Previously one mesh was drawn per physics particle, so a 6-particle strand
   could only ever show ~5 beads and the spacing jumped around as the solver
   moved. Rendering is now decoupled from simulation: the particles define a
   smooth curve, and elements are laid along that curve by ARC LENGTH. Bead
   count and spacing stay constant no matter what the solver does.
   ------------------------------------------------------------------- */
const geoPearl=new THREE.SphereGeometry(1,20,14);
const geoSpacer=new THREE.CylinderGeometry(1,1,1,16);
const geoCrimp=new THREE.CylinderGeometry(1,1,1,12);
const geoCord=new THREE.CylinderGeometry(1,1,1,8);
const geoLink=new THREE.TorusGeometry(.0105,.0035,10,22);
const geoFlowerBead=extrude(sakuraShape(.036,5),.018,.005,18);
const matChain=new THREE.MeshPhysicalMaterial({color:0x9AA0AE,roughness:.13,metalness:.95,
  clearcoat:1,clearcoatRoughness:.02,envMapIntensity:2.8});

/* curve resampling */
const SAMP=48, CORDSEG=22;
const sPts=[];for(let i=0;i<=SAMP;i++) sPts.push(new V3());
const sLen=new Float32Array(SAMP+1);
const curvePts=[];for(let i=0;i<=NLINK;i++) curvePts.push(new V3());
const strandCurve=new THREE.CatmullRomCurve3(curvePts,false,"catmullrom",.5);
let strandLen=0;
function resampleStrand(){
  for(let i=0;i<NLINK;i++) curvePts[i].copy(P[i].p);
  curvePts[NLINK].copy(_ringW);
  strandCurve.needsUpdate=true;
  for(let i=0;i<=SAMP;i++) strandCurve.getPoint(i/SAMP,sPts[i]);
  sLen[0]=0;
  for(let i=1;i<=SAMP;i++) sLen[i]=sLen[i-1]+sPts[i].distanceTo(sPts[i-1]);
  strandLen=sLen[SAMP];
}
function atArc(d,outP,outT){
  d=MU.clamp(d,0,strandLen);
  let i=1;while(i<SAMP&&sLen[i]<d) i++;
  const seg=Math.max(sLen[i]-sLen[i-1],1e-9);
  outP.lerpVectors(sPts[i-1],sPts[i],(d-sLen[i-1])/seg);
  if(outT) outT.subVectors(sPts[i],sPts[i-1]).multiplyScalar(1/seg);
}

let elems=[],cordSegs=[],clasp=null;
function clearStrand(){
  elems.concat(cordSegs).forEach(function(m){if(m)scene.remove(m);});
  if(clasp)scene.remove(clasp);
  elems=[];cordSegs=[];clasp=null;
}
function rand1(i){const x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x);}
function makeElem(kind,i){
  let m;
  if(kind==="pearl"){
    m=new THREE.Mesh(geoPearl,matPearl);
    m.scale.setScalar(.0148*(.90+.20*rand1(i)));   // real pearls are never uniform
  } else if(kind==="bead"){
    m=new THREE.Mesh(geoPearl,matBead);
    m.scale.setScalar(.0180*(.92+.16*rand1(i+7)));
  } else if(kind==="spacer"){
    m=new THREE.Mesh(geoSpacer,matSilver);m.scale.set(.0118,.0065,.0118);
  } else if(kind==="crimp"){
    m=new THREE.Mesh(geoCrimp,matSilver);m.scale.set(.0072,.0115,.0072);
  } else if(kind==="flower"){
    m=new THREE.Mesh(geoFlowerBead,matIrid);
  } else {
    m=new THREE.Mesh(geoLink,matChain);m.scale.x=.58;  // links are oval, not round
  }
  m.castShadow=true;m.userData.kind=kind;m.userData.len=ELEM[kind].len;
  return m;
}
// HEAD clears the clasp; TAIL is set so the LAST element lands on the charm
// ring's tube (ring radius .042) rather than stopping outside it.
const HEAD=.020, TAIL=.028;
function buildStrand(){
  clearStrand();
  const st=ST();
  if(st.cord){
    for(let i=0;i<CORDSEG;i++){
      const m=new THREE.Mesh(geoCord,matCord);m.castShadow=true;
      scene.add(m);cordSegs.push(m);
    }
  }
  // enough elements to cover any plausible strand length; extras hide themselves
  let acc=0,i=0;
  while(acc<.60&&i<64){
    const kind=st.seq[i%st.seq.length];
    const m=makeElem(kind,i);
    scene.add(m);elems.push(m);
    acc+=m.userData.len;i++;
  }
  clasp=new THREE.Mesh(extrude(heartShape(.060),.020,.007,20),matSilver);
  clasp.castShadow=true;scene.add(clasp);
  const im=1/st.beadMass;
  for(let i=1;i<P.length;i++) P[i].w=im;
  for(let k=0;k<bend.length;k++) bend[k].compliance=st.bend;
}

/* ---- push meshes to physics state ---- */
const _d2=new V3(),UP_Y=new V3(0,1,0),_prevV=new V3();
const _lx=new V3(),_lz=new V3(),_ringW=new V3(),_linkBasis=new THREE.Matrix4();
const _ep=new V3(),_ep2=new V3(),_et=new V3();
const LINK_REF=new V3(0,0,1);                 // roll reference: face rings at the camera
const RING_L=new V3(0,CH.h/2+.034,0);         // charm ring, pendant-local
function syncMeshes(dt){
  charm.position.copy(pend.x);
  charm.quaternion.copy(pend.q);

  // jelly squash: stretch along the acceleration axis, purely cosmetic
  if(MT().squash){
    _t.subVectors(pend.v,_prevV).multiplyScalar(1/Math.max(dt,1e-4));
    const a=MU.clamp(_t.length()/900,0,1);
    _t.normalize().applyQuaternion(_qc.copy(pend.q).conjugate());
    const s=1+a*.10;
    charmBody.scale.set(1-(s-1)*.5*Math.abs(_t.x)-(s-1)*.25,
                        1+(s-1)*Math.abs(_t.y)*1.0-(s-1)*.25,
                        1-(s-1)*.5*Math.abs(_t.z)-(s-1)*.25);
  } else charmBody.scale.set(1,1,1);
  _prevV.copy(pend.v);

  _ringW.copy(RING_L).applyQuaternion(pend.q).add(pend.x);
  resampleStrand();

  // cord: short cylinders laid nose to tail along the curve, so it reads as one
  // continuous strand rather than a polyline with visible kinks at each joint
  for(let i=0;i<cordSegs.length;i++){
    const m=cordSegs[i];
    atArc(strandLen*i/CORDSEG,_ep);
    atArc(strandLen*(i+1)/CORDSEG,_ep2);
    m.position.addVectors(_ep,_ep2).multiplyScalar(.5);
    _d2.subVectors(_ep2,_ep);
    const L=_d2.length()||1;_d2.multiplyScalar(1/L);
    m.quaternion.setFromUnitVectors(UP_Y,_d2);
    m.scale.set(.0042,L*1.04,.0042);
  }

  // Elements are laid end to end, then the run is stretched slightly so it fills
  // the span from clasp to charm ring EXACTLY. Previously the run simply stopped
  // once the next element would overflow, which left a dead gap of up to one
  // element before the pendant -- the chain visibly failed to reach it.
  const span=Math.max(strandLen-HEAD-TAIL,1e-4);
  let acc=0,n=0;
  while(n<elems.length&&acc+elems[n].userData.len<=span){acc+=elems[n].userData.len;n++;}
  if(n===0){n=1;acc=elems.length?elems[0].userData.len:span;}
  const fill=span/Math.max(acc,1e-6);          // ~1.00 to 1.10, never a visible stretch
  let d=HEAD;
  for(let i=0;i<elems.length;i++){
    const m=elems[i];
    if(i>=n){m.visible=false;continue;}
    const len=m.userData.len*fill,c=d+len*.5;
    d+=len;
    m.visible=true;
    atArc(c,_ep,_et);
    _et.normalize();
    m.position.copy(_ep);
    orientAlong(m,_et,m.userData.kind==="link"&&(i&1));
    if(m.userData.kind==="flower") m.rotateX(Math.PI/2);
  }

  if(clasp){
    atArc(.011,_ep,_et);_et.normalize();
    clasp.position.copy(_ep);
    orientAlong(clasp,_et,false);
    clasp.rotateZ(Math.PI);
  }
}

/* Build an explicit frame: local Y along the strand, and for chain links flip the
   hole axis 90deg on alternate links so they interlock the way real links do.
   setFromUnitVectors alone leaves the roll arbitrary, which is what made some
   links land edge-on and vanish. */
function orientAlong(m,tan,roll90){
  _lx.crossVectors(LINK_REF,tan);
  if(_lx.lengthSq()<1e-8) _lx.set(1,0,0); else _lx.normalize();
  _lz.crossVectors(_lx,tan).normalize();
  if(roll90) _linkBasis.makeBasis(_lz,tan,_lx.negate());
  else       _linkBasis.makeBasis(_lx,tan,_lz);
  m.quaternion.setFromRotationMatrix(_linkBasis);
}

let yaw=0,pitch=0,yawV=0,pitchV=0;
const tiltQuat=new Q(),tiltCorrection=new Q(-Math.SQRT1_2,0,0,Math.SQRT1_2);
const tiltScreenQuat=new Q(),tiltEuler=new THREE.Euler(),tiltZee=new V3(0,0,1);
let tiltReady=false,tiltListening=false;
let zoom=1,pinchStart=0,pinchZoom=1;
const phoneTarget=new V3(0,.34,0);
phone.position.copy(phoneTarget);
const pointers=new Map();
let mode=null, lastX=0, lastY=0, panStart=new V3(), panOrigin=new V3();
const plane=new THREE.Plane(new V3(0,0,1),0);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hitP=new V3();
const hookPlane=new THREE.Plane(),hookNormal=new V3(),hookWorld=new V3();
const hintEl=document.getElementById("hint");

function toWorld(cx,cy){
  const r=canvas.getBoundingClientRect();
  ndc.x=((cx-r.left)/r.width)*2-1;ndc.y=-((cy-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);ray.ray.intersectPlane(plane,hitP);return hitP;
}
function setZoom(next){
  zoom=MU.clamp(next,.55,1.55);
  const aspect=camera.aspect||innerWidth/innerHeight;
  camera.position.z=MU.clamp(3.7/Math.min(aspect,.62),4.3,6.8)*zoom;
}
function pointerDistance(){
  const points=Array.from(pointers.values()),a=points[0],b=points[1];
  return Math.hypot(a.x-b.x,a.y-b.y);
}
function moveAttachment(cx,cy){
  const r=canvas.getBoundingClientRect();
  ndc.x=((cx-r.left)/r.width)*2-1;ndc.y=-((cy-r.top)/r.height)*2+1;
  hookNormal.set(0,0,1).applyQuaternion(phone.quaternion);
  hookWorld.copy(phone.position).addScaledVector(hookNormal,HOOK_Z);
  hookPlane.setFromNormalAndCoplanarPoint(hookNormal,hookWorld);
  ray.setFromCamera(ndc,camera);
  if(!ray.ray.intersectPlane(hookPlane,hookWorld))return;
  attachmentLocal.copy(hookWorld).sub(phone.position)
    .applyQuaternion(_qc.copy(phone.quaternion).conjugate());
  attachmentLocal.x=MU.clamp(attachmentLocal.x,-PH.w/2+.06,PH.w/2-.06);
  attachmentLocal.y=MU.clamp(attachmentLocal.y,-PH.h/2+.08,PH.h/2-.08);
  attachmentLocal.z=HOOK_Z;

}
canvas.addEventListener("contextmenu",function(e){e.preventDefault();});

  e.preventDefault();setZoom(zoom*Math.exp(e.deltaY*.001));
},{passive:false});
canvas.addEventListener("pointerdown",function(e){
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  hintEl.classList.add("gone");
  if(pointers.size===2){pinchStart=pointerDistance();pinchZoom=zoom;}
  ray.setFromCamera(ndc.set(
    ((e.clientX-canvas.getBoundingClientRect().left)/canvas.getBoundingClientRect().width)*2-1,
    -((e.clientY-canvas.getBoundingClientRect().top)/canvas.getBoundingClientRect().height)*2+1),camera);
  if(pointers.size===1&&ray.intersectObject(loop).length){
    mode="hook";
  } else if(pointers.size>=2||e.button===2||e.shiftKey){
    mode="pan";panStart.copy(toWorld(e.clientX,e.clientY));panOrigin.copy(phoneTarget);
  }else{
    mode="spin";lastX=e.clientX;lastY=e.clientY;yawV=0;pitchV=0;
  }
  intro=false;
});
canvas.addEventListener("pointermove",function(e){
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){
    const distance=pointerDistance();
    if(distance>1&&pinchStart>1)setZoom(pinchZoom*pinchStart/distance);
  }
  if(mode==="hook"){
    moveAttachment(e.clientX,e.clientY);
  } else if(mode==="spin"){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    yaw   += dx*0.0115;
    pitch  = MU.clamp(pitch + dy*0.0090, -1.25, 1.25);
    yawV   = dx*0.0115*60;
    pitchV = dy*0.0090*60;
    feedDragShake(dx,performance.now());   // rapid back-and-forth = shake-to-unstick
  } else if(mode==="pan"){
    const w=toWorld(e.clientX,e.clientY);
    phoneTarget.set(
      MU.clamp(panOrigin.x+(w.x-panStart.x),-1.25,1.45),
      MU.clamp(panOrigin.y+(w.y-panStart.y),-.85,.95),0);
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size===0) mode=null;
}

const tiltBtn=document.getElementById("tilt");
const needsPerm=typeof DeviceOrientationEvent!=="undefined"&&
  typeof DeviceOrientationEvent.requestPermission==="function";
if(needsPerm||"ondeviceorientation" in window) tiltBtn.style.display="block";
function startTilt(){
  if(tiltListening)return;
  tiltListening=true;
  window.addEventListener("deviceorientation",function(ev){
    if(!S.tilt)return;
    const g=MU.clamp((ev.gamma||0)/45,-1,1), b=MU.clamp(((ev.beta||0)-40)/60,-1,1);
    tiltEuler.set((ev.beta||0)*Math.PI/180,(ev.alpha||0)*Math.PI/180,
      -(ev.gamma||0)*Math.PI/180,"YXZ");
    tiltQuat.setFromEuler(tiltEuler).multiply(tiltCorrection);
    const screenAngle=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180;
    tiltScreenQuat.setFromAxisAngle(tiltZee,-screenAngle);
    tiltQuat.multiply(tiltScreenQuat);
    tiltReady=true;
    _g.set(g*GRAVITY*.75,-GRAVITY*Math.sqrt(Math.max(.15,1-g*g*.5)),b*GRAVITY*.30);
  },true);
}
tiltBtn.addEventListener("click",function(){
  if(S.tilt){S.tilt=false;tiltReady=false;_g.set(0,-GRAVITY,0);
    tiltBtn.textContent=T("tiltOff");tiltBtn.setAttribute("aria-pressed","false");return;}
  if(needsMotionPerm){
    // Piggyback the shake-to-unstick permission on this same tap, so the
    // person only ever sees one iOS permission prompt for tilt, not two.
    DeviceMotionEvent.requestPermission().then(function(r){
      if(r==="granted") window.addEventListener("devicemotion",onDeviceMotion,true);
    })["catch"](function(){});
  }
  if(needsPerm){
    DeviceOrientationEvent.requestPermission().then(function(r){
      if(r!=="granted")return;
      S.tilt=true;intro=false;startTilt();tiltBtn.textContent=T("tiltOn");
      tiltBtn.setAttribute("aria-pressed","true");hintEl.classList.add("gone");
    })["catch"](function(){});
    return;
  }
  S.tilt=true;intro=false;startTilt();tiltBtn.textContent=T("tiltOn");
  tiltBtn.setAttribute("aria-pressed","true");hintEl.classList.add("gone");
});

  const W=1080,H=Math.round(W*src.height/src.width);
  const out=document.createElement("canvas");out.width=W;out.height=H+92;
  const g=out.getContext("2d");
  const bg=g.createLinearGradient(0,0,W,H+92);
  bg.addColorStop(0,"#FFFFFF");bg.addColorStop(.5,"#DEDEE8");bg.addColorStop(1,"#FFFFFF");
  g.fillStyle=bg;g.fillRect(0,0,W,H+92);
  g.drawImage(src,22,22,W-44,H);
  g.fillStyle="#14121A";g.font="800 30px Helvetica,Arial";g.textAlign="left";
  g.fillText("mallang charm",24,H+70);
  g.fillStyle="#7A7A8C";g.font="600 20px Helvetica,Arial";g.textAlign="right";
  g.fillText("말랑참",W-24,H+68);
  flash.classList.remove("pop");void flash.offsetWidth;flash.classList.add("pop");
  out.toBlob(function(b){const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="mallang-charm.png";a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},4000);},"image/png");
});

/* ===================================================================
   BOOT + LOOP
   =================================================================== */
// Camera sits slightly high and aims below centre, so the phone crops off
// the top of frame and the charm sits in the middle third.
const VIEW_Y=.30, VIEW_LOOK_Y=-.16;
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.set(0,VIEW_Y,0);setZoom(zoom);
  camera.updateProjectionMatrix();camera.lookAt(0,VIEW_LOOK_Y,0);
}
addEventListener("resize",resize);resize();
applyCase();applyBackdropStyle();applyBackground();buildPendant();buildStrand();redrawArt();applyLook();paint();

// Start the strand below and slightly away from the rear hook.
const startAnchor=new V3().copy(ANCHOR_LOCAL).applyQuaternion(phone.quaternion).add(phone.position);
const startOutward=new V3(0,0,-1).applyQuaternion(phone.quaternion);
const startHang=new V3(0,-1,0).addScaledVector(startOutward,.9).normalize();
for(let i=0;i<NLINK;i++){
  P[i].p.copy(startAnchor).addScaledVector(startHang,i*LINKLEN);
  P[i].pr.copy(P[i].p);P[i].v.set(0,0,0);
}
_rA.copy(ANCH_L).applyQuaternion(pend.q);
pend.x.copy(P[NLINK-1].p).sub(_rA);pend.v.set(0,0,0);pend.w.set(0,0,0);
pend.xp.copy(pend.x);pend.qp.copy(pend.q);
phPosA.copy(phone.position);phPosB.copy(phone.position);
phQuatA.copy(phone.quaternion);phQuatB.copy(phone.quaternion);
for(let i=0;i<150;i++) stepPhysics(1/60);
for(let i=0;i<P.length;i++){
  P[i].v.set(0,0,0);P[i].pr.copy(P[i].p);
}
pend.v.set(0,0,0);pend.w.set(0,0,0);pend.xp.copy(pend.x);pend.qp.copy(pend.q);

const dragQ=new Q(),dragE=new THREE.Euler(),wantQ=new Q();
const prevPhonePos=new V3().copy(phone.position),prevPhoneQ=new Q().copy(phone.quaternion);
let last=performance.now(),t0=last,intro=true;

function frame(now){
  requestAnimationFrame(frame);
  // The rAF timestamp is the time the frame STARTED, which can precede the
  // performance.now() captured at boot, so the first dt can be negative. A
  // negative dt makes Math.pow(k,dt) explode and lerp/slerp overshoot to
  // astronomical values, which threw the phone and the whole strand off-screen.
  // Clamp to a sane range and never step physics on a non-positive dt.
  const dt=MU.clamp((now-last)/1000,0,1/30);last=now;
  const t=(now-t0)/1000;

  if(intro){
    const introFade=Math.max(0,1-t/5.5);
    yaw = Math.sin(t*1.65)*0.82*introFade;
    pitch = Math.sin(t*1.1)*0.14*introFade;
    phoneTarget.y=.04+Math.sin(t*1.8)*.030*introFade;
    if(t>5.6) intro=false;
  } else if(S.tilt&&mode===null){
    yawV=0;pitchV=0;
  } else if(mode!=="spin"){
    // flick momentum, then a slow settle back toward the hero pose
    yaw   += yawV*dt;   yawV   *= Math.pow(0.06,dt);
    pitch  = MU.clamp(pitch+pitchV*dt,-1.25,1.25); pitchV *= Math.pow(0.06,dt);
    if(Math.abs(yawV)<0.05&&mode===null){
      yaw   += (0-yaw)*(1-Math.pow(0.55,dt));
      pitch += (0-pitch)*(1-Math.pow(0.55,dt));
    }
  }
  if(!dragging()&&!intro) phoneTarget.y=phoneTarget.y*0.98+(0.04+Math.sin(t*0.9)*0.020)*0.02;

  if(dt<=0){renderer.render(scene,camera);return;}

  prevPhonePos.copy(phone.position);prevPhoneQ.copy(phone.quaternion);
  phone.position.lerp(phoneTarget,1-Math.pow(0.0008,dt));
  dragE.set(pitch,yaw,0,"YXZ");dragQ.setFromEuler(dragE);
  if(S.tilt&&tiltReady)wantQ.copy(tiltQuat);
  else wantQ.copy(dragQ).multiply(baseQuat);
  phone.quaternion.slerp(wantQ,1-Math.pow(0.00004,dt));

  // substep interpolation targets + kinematic velocities for contact friction
  phPosA.copy(prevPhonePos);phPosB.copy(phone.position);
  phQuatA.copy(prevPhoneQ);phQuatB.copy(phone.quaternion);
  phVel.subVectors(phone.position,prevPhonePos).multiplyScalar(1/Math.max(dt,1e-4));
  const dqp=phone.quaternion.clone().multiply(prevPhoneQ.clone().invert());
  phOmega.set(dqp.x,dqp.y,dqp.z).multiplyScalar(2/Math.max(dt,1e-4));
  if(dqp.w<0) phOmega.negate();

  stepPhysics(dt);
  if(unstickRequested){tryUnstick();unstickRequested=false;}
  if(!dragging()&&!S.tilt){
    const idleDamp=intro?.92:.975;
    for(let i=1;i<P.length;i++)P[i].v.multiplyScalar(idleDamp);
  }
  syncMeshes(dt);
  updateContactShadow();

  for(let i=0;i<sparks.length;i++){
    const s=sparks[i],u=s.userData;
    s.position.y+=Math.sin(t*u.sp+u.ph)*.0009;
    s.scale.setScalar(u.base*(.65+.35*Math.sin(t*u.sp*2.1+u.ph)));
    s.rotation.z=t*.25+u.ph;
  }
  renderer.render(scene,camera);
}
function dragging(){return mode!==null;}
requestAnimationFrame(frame);
})();
</script>
